# Copy to application-local.properties; keep actual credentials out of Git.
# Database name and credentials must match your own MySQL instance.
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
jwt.secret=${JWT_SECRET:}
alipay.app-id=${ALIPAY_APP_ID:}
alipay.private-key=${ALIPAY_PRIVATE_KEY:}
alipay.public-key=${ALIPAY_PUBLIC_KEY:}
alipay.seller-id=${ALIPAY_SELLER_ID:}

# JWT_SECRET must contain at least 32 characters; use a random value.
# Optional Redis authentication (empty for a local instance without a password).
spring.data.redis.password=${REDIS_PASSWORD:}
# Ordinary unpaid orders only. Set enabled=false to disable automatic closure.
order.unpaid-timeout-minutes=30
order.unpaid-expiry.enabled=true
order.unpaid-expiry.delay-ms=60000

# Enable only after applying the inventory reservation migration.
inventory.reservation.enabled=false

# Per buyer: active held order rows and total held units (ordinary checkout only).
inventory.reservation.max-held-orders=10
inventory.reservation.max-held-units=50
